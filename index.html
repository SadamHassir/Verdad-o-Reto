<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verdad o Reto</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #eaeaea;
            --primary: #e94560;
            --secondary: #0f3460;
            --accent: #16213e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh; 
            margin: 0;
            text-align: center;
            user-select: none; 
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; 
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 85%;
            max-width: 400px;
            background: var(--accent);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        h1 { margin-top: 0; color: var(--primary); font-size: 28px; }
        h2 { font-size: 24px; }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 18px 20px;
            margin: 10px 0;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background-color 0.2s;
            touch-action: manipulation; 
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-verdad { background-color: #00ADB5; }
        .btn-reto { background-color: #FF5722; }
        .btn-volver { background-color: var(--secondary); font-size: 16px; margin-top: 25px; }

        .niveles-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 10px;
            margin: 20px 0;
        }

        .niveles-container label {
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            background-color: var(--secondary);
            padding: 15px;
            border-radius: 12px;
            transition: background-color 0.2s;
        }

        .niveles-container input[type="checkbox"] {
            width: 24px;
            height: 24px;
            margin-right: 15px;
            accent-color: var(--primary);
        }

        .ruleta-container {
            display: none;
            margin: 30px 0;
        }

        .ruleta {
            width: 80px;
            height: 80px;
            border: 8px solid var(--secondary);
            border-top: 8px solid var(--primary);
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #resultado-texto {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            min-height: 100px;
            display: none;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1: INICIO Y NIVELES -->
    <div id="pantalla-inicio" class="screen active">
        <h1>Verdad o Reto</h1>
        <p style="font-size: 15px; margin-bottom: 5px;">Elegí los niveles para mezclar:</p>
        
        <div class="niveles-container">
            <label><input type="checkbox" value="1" class="nivel-cb" checked> 🟢 Nivel 1 </label>
            <label><input type="checkbox" value="2" class="nivel-cb"> 🟡 Nivel 2 </label>
            <label><input type="checkbox" value="3" class="nivel-cb"> 🔴 Nivel 3 </label>
        </div>

        <button onclick="iniciarJuego()">¡Empezar a jugar!</button>
    </div>

    <!-- PANTALLA 2: ELECCIÓN -->
    <div id="pantalla-eleccion" class="screen">
        <h1>Tu turno</h1>
        <p style="margin-bottom: 25px;">¿Qué vas a elegir?</p>
        <button class="btn-verdad" onclick="jugar('verdad')">Verdad</button>
        <button class="btn-reto" onclick="jugar('reto')">Reto</button>
        <button class="btn-volver" onclick="volverAlInicio()">⚙️ Cambiar Niveles</button>
    </div>

    <!-- PANTALLA 3: RULETA Y RESULTADO -->
    <div id="pantalla-resultado" class="screen">
        <h2 id="titulo-resultado">Girando...</h2>
        
        <div class="ruleta-container" id="ruleta-animacion">
            <div class="ruleta"></div>
        </div>

        <p id="resultado-texto"></p>

        <button id="btn-siguiente" style="display: none;" onclick="siguienteTurno()">Siguiente Turno</button>
    </div>

    <script>
        const verdades = {
            1: [
                "Contate algo vergonzoso, algun secretito o situacion rara",
                "Alguna vez mentiste sobre algo para caerle bien a alguien o hacer levante? Explayate",
                "Qué es lo más ridículo que hiciste cuando estabas borracho y después te arrepentiste?",
                "Contate algo vergonzoso DE ALGUIEN MAS, sisi, quemalo tranqui es tu momento",
                "Anécdota incomoda en la calle o afuera de tu casa",
                "Cual fue el peor lugar donde cagaste? Se gráfico",
                "Que costumbre tuya pensas que es una mierda?",
                "Conta una cosa romántica que hayas hecho",
                "A todos nos gustan cosas infantiles, explica que te gusta a vos",
                "De las ultimas 5 personas que seguiste en IG, explica porque te las queres (o no) cojer"
            ],
            2: [
                "Cuál es la cosa más sucia que te excitó y te da vergüenza admitir?",
                "Describí alguna foto subida de tono o nude que hayas mandado, si 'no existe' tomás",
                "Quién de este grupo te genera más curiosidad sexual? Explicate",
                "Cuál fue la situación más comprometedora en la que te descubrieron o casi te descubren?",
                "Cuál es tu mayor inseguridad cuando estás desnudo/a con otra persona?",
                "Contá la última vez que te pajeaste pensando en alguien de este grupo o de tu círculo cercano (o lo pensaste al menos)",
                "Fantasia sexual, sorprendenos",
                "Qué es lo más intenso o raro que te pidieron en la cama y aceptaste (o rechazaste)?",
                "Conta algo realmente incomodo y/o personal",
                "Elegi 3 personas para hacer una orgia (excluyendo a Teo, ya sabemos que esta invitado)"
            ],
            3: [
                "Describí con detalle la paja más rara o intensa que te diste en tu vida",
                "Alguna vez te filmaste o te dejaste filmar cogiendo (valen fotos)? Si sí, contá el contexto. Si no, tomás",
                "Describí tu fantasía más oscura o prohibida, la que casi no te animás a decir en voz alta. Zarpate, sino tomas eh",
                "Conta alguna paja que te hayas hecho afuera de tu casa",
                "Te cogerías a alguien de este grupo sin pensarlo dos veces si hoy estuvieras soltero/a y sin consecuencias? (No tenes que dar nombres)",
                "Explica con detalle como te gusta pajearte/que te pajeen",
                "Elegi a una persona random, acosalo sexualmente (con palabras), tenes que ponerlo/a MUY incomodo/a. Si alguno no quiere, ambos toman",
                "Conta algo MUY asqueroso tuyo",
                "Elegi a dos personas que te parezcan que hacen una buena pareja, explayate, ponelos incomodos jeje",
            ]
        };

        const retos = {
            1: [
                "Dejá que la persona a tu derecha elija una canción y canta el estribillo lo mejor que puedas",
                "Imitá a alguien del grupo durante 15 segundos (sin decir quién es, si nadie adivina tomás)",
                "El jugador de la derecha elige un chat tuyo de IG, lee los ultimos 15 mensajes en voz alta (sin contar reels)",
                "Dejá que el grupo vote cuál es tu peor hábito y no te defiendas (Denle duro)",
                "Dejá que alguien del grupo abra tu galería y elija una foto para mostrarnos",
                "Elegi 2 personas, tienen 5 segundos para decir en voz alta una palabra, si es la misma tomás, sino toman ellos",
                "Concurso de flexiones/abdominales/dominadas con persona random, el perdedor toma",
                "El grupo elije una palabra que no podes decir por el resto del juego, si la decis tomás",
                "CHANCHO",
                "Tomás, por boludo",
                "Toman todos, provechito"
            ],
            2: [
                "Dejá que alguien random te dé un chupón en alguna parte del cuerpo (vos elegís el lugar, pero tiene que quedar al menos un poco marcado)",
                "El grupo decide que prenda de ropa te tenes que sacar, te jodes hasta que terminemos de jugar",
                "Elegí a alguien del grupo al azar y besalo/a en la mejilla lo más cerca posible de la boca, despacio",
                "Dejá que el grupo elija una foto tuya de la galería y la describan en voz alta como si fuera una crítica",
                "Imitá durante 10 segundos cómo sería tu cara y sonido si estuvieras a punto de venirte (efectivamente, vas a tener que tomar)",
                "Elegí a dos personas y hacé que una le dé de beber a la otra sin usar las manos, sino, toman los tres",
                "Contá en voz alta tu número de personas con las que cogiste y el grupo tiene que adivinar si estás mintiendo o no (si adivinan, tomás)",
                "Dejá que alguien te venda los ojos y te dé de tomar o de comer algo que elijan ellos (no sean asquerosos)",
                "El grupo elige una parte de tu cuerpo y tenés que dejar que te la toquen o te la miren de cerca durante 10 segundos",
                "Una persona random tiene que tomar un shot desde tu clavicula, si no quiere, toman los dos"
            ],
            3: [
                "Elegí a alguien random y hagan un apreton de lenguas (si no quieren, toman los dos)",
                "Chau dos prendas de ropa, te jodes hasta que terminemos de jugar",
                "Dejá que alguien random te bese el cuello o la clavícula durante 10 segundos mientras el resto mira, sino ambos toman",
                "BESO TRIPLE (si alguno se niega, toman los tres)",
                "Sacate una prenda de abajo y quedate en ropa interior hasta que termine la vuelta",
                "Elegí a alguien random y sentate en su regazo de frente, mirándolo a los ojos, durante 15 segundos sin hablar (Se tienen que tocar las frentes)",
                "Dejá que una persona random te meta la mano debajo de la remera y te toque la espalda o el pecho por 10 segundos. Te tiene que manosear sobroso",
                "Hace de chapar con alguien random, zarpense o sino toman",
                "Elegi a una persona random y tienen que bailar un cuarteto bien pegaditos, te la tenes que levantar a cualquier costa",
                "Estas en frente del amor de tu vida, sacate alguna prenda y bebotea. Hacete el sexy sino no cuenta"
            ]
        };

        let nivelesSeleccionados = [];

        function cambiarPantalla(idPantalla) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(idPantalla).classList.add('active');
        }

        function iniciarJuego() {
            nivelesSeleccionados = Array.from(document.querySelectorAll('.nivel-cb:checked')).map(cb => parseInt(cb.value));
            
            if (nivelesSeleccionados.length === 0) {
                alert("¡Tenés que elegir al menos un nivel para jugar!");
                return;
            }
            cambiarPantalla('pantalla-eleccion');
        }

        function jugar(tipo) {
            cambiarPantalla('pantalla-resultado');
            
            const ruleta = document.getElementById('ruleta-animacion');
            const texto = document.getElementById('resultado-texto');
            const btnSiguiente = document.getElementById('btn-siguiente');
            const titulo = document.getElementById('titulo-resultado');

            ruleta.style.display = 'block';
            texto.style.display = 'none';
            btnSiguiente.style.display = 'none';
            titulo.innerText = tipo === 'verdad' ? "Ruleta de Verdad..." : "Ruleta de Reto...";

            let opcionesDisponibles = [];
            const baseDeDatos = tipo === 'verdad' ? verdades : retos;

            nivelesSeleccionados.forEach(nivel => {
                opcionesDisponibles = opcionesDisponibles.concat(baseDeDatos[nivel]);
            });

            const fraseElegida = opcionesDisponibles[Math.floor(Math.random() * opcionesDisponibles.length)];

            setTimeout(() => {
                ruleta.style.display = 'none'; 
                titulo.innerText = tipo === 'verdad' ? "¡VERDAD!" : "¡RETO!";
                texto.innerText = fraseElegida; 
                texto.style.display = 'block';
                btnSiguiente.style.display = 'block'; 
            }, 1000);
        }

        function siguienteTurno() {
            cambiarPantalla('pantalla-eleccion');
        }

        function volverAlInicio() {
            cambiarPantalla('pantalla-inicio');
        }
    </script>
</body>
</html>
